name: Deploy Tavi Journal Entry viewer to GitHub Pages

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/tavi-pages.yml
      - tavi-poc/viewer/tavi-inst-hmd-view.html
      - tavi-poc/viewer/tavi-viewer.html
      - tavi-poc/viewer/tavi-viewer.js
      - tavi-poc/taxonomy/tavi-tax.json
      - tavi-poc/taxonomy/tavi-uuid-tax.json
      - tavi-poc/taxonomy/tavi-schema.json
      - tavi-poc/instance/tavi-ins.json
      - tavi-poc/instance/tavi-ins.csv
      - tavi-poc/instance/tavi-uuid-ins.json
      - tavi-poc/instance/tavi-uuid-ins.csv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Prepare approved historical and common viewers
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/tavi-pages"
          test ! -e "${site}"
          mkdir -p "${site}/viewer" "${site}/instance" "${site}/taxonomy"
          sources=(
            "tavi-poc/viewer/tavi-viewer.html"
            "tavi-poc/viewer/tavi-viewer.js"
            "tavi-poc/instance/tavi-ins.json"
            "tavi-poc/instance/tavi-ins.csv"
            "tavi-poc/instance/tavi-uuid-ins.json"
            "tavi-poc/instance/tavi-uuid-ins.csv"
            "tavi-poc/taxonomy/tavi-tax.json"
            "tavi-poc/taxonomy/tavi-uuid-tax.json"
            "tavi-poc/taxonomy/tavi-schema.json"
          )
          old="tavi-poc/viewer/tavi-inst-hmd-view.html"
          test -f "${old}"
          test ! -L "${old}"
          cp "${old}" "${site}/tavi-inst-hmd-view.html"
          printf '%s\n' \
            '5c295807ebd20b95cf4ebfaa44a2fbc35072c527b2b94413606a8c52ff3310b8  tavi-inst-hmd-view.html' \
            | (cd "${site}" && sha256sum --check -)
          for src in "${sources[@]}"; do
            test -f "${src}"
            test ! -L "${src}"
            rel="${src#tavi-poc/}"
            cp "${src}" "${site}/${rel}"
            cmp -s "${src}" "${site}/${rel}"
          done
          cd "${site}"
          expected="$(printf '%s\n' \
            './instance' \
            './instance/tavi-ins.csv' \
            './instance/tavi-ins.json' \
            './instance/tavi-uuid-ins.csv' \
            './instance/tavi-uuid-ins.json' \
            './tavi-inst-hmd-view.html' \
            './taxonomy' \
            './taxonomy/tavi-schema.json' \
            './taxonomy/tavi-tax.json' \
            './taxonomy/tavi-uuid-tax.json' \
            './viewer' \
            './viewer/tavi-viewer.html' \
            './viewer/tavi-viewer.js')"
          actual="$(find . -mindepth 1 -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${expected}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          test -z "$(find . -type l -print)"
          test -z "$(find . -type f -links +1 -print)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tavi-pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
