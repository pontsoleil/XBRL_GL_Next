name: Deploy Tavi Journal Entry viewer to GitHub Pages

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/tavi-pages.yml
      - tavi-poc/viewer/tavi-inst-hmd-view.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Prepare the one accepted HTML file
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/tavi-pages"
          test ! -e "${site}"
          mkdir -p "${site}"
          source="tavi-poc/viewer/tavi-inst-hmd-view.html"
          test -f "${source}"
          test ! -L "${source}"
          cp "${source}" "${site}/tavi-inst-hmd-view.html"
          cd "${site}"
          printf '%s\n' \
            '85229c898db0a6741a0cd09081df7b9433389ca89fc408391c80e8107e124154  tavi-inst-hmd-view.html' \
            | sha256sum --check -
          actual="$(find . -mindepth 1 -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' './tavi-inst-hmd-view.html')"
          test "${actual}" = "${expected}"
          test -z "$(find . -type l -print)"
          test -z "$(find . -type f -links +1 -print)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tavi-pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
