<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>XBRL GL Next — Tavi Viewer</title>
<style>
:root{color-scheme:dark;--bg:#101419;--pane:#1a2028;--edge:#343d48;--muted:#aab7c6;--text:#eef2f6;--accent:#a9c7e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{height:100dvh;min-height:500px;display:flex;flex-direction:column;padding:18px;gap:14px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:21px;margin:0}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.1em}label{color:var(--muted);font-size:12px;margin-right:7px}
select,button{background:#253140;color:#eef2f6;border:1px solid #536174;border-radius:5px;padding:7px 10px;font:inherit}select{max-width:min(80vw,470px)}button{cursor:pointer}button[aria-selected="true"]{background:#344c68;border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.panes{display:grid;grid-template-columns:minmax(320px,0.95fr) minmax(0,1.55fr);gap:14px;flex:1;min-height:0}.pane{border:1px solid var(--edge);border-radius:9px;background:var(--pane);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.pane-head{padding:12px 16px;border-bottom:1px solid var(--edge);background:#222a34;flex:none}h2{font-size:15px;margin:0}.subtitle{font-size:12px;color:var(--muted)}.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#1d2630;border-bottom:1px solid var(--edge)}.scroll{overflow:auto;flex:1;min-height:0}
pre{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:2;margin:0;padding:14px;min-width:max-content}.source-name{font-size:11px;color:var(--muted);padding:7px 14px;background:#202832;border-bottom:1px solid var(--edge)}.status{color:var(--muted);font-size:12px}.error{color:#ffb4b4}
table{border-collapse:collapse;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre}th,td{padding:7px 9px;border:1px solid var(--edge);text-align:left;vertical-align:top}thead th{position:sticky;top:0;background:#263342;z-index:2}tbody th{position:sticky;left:0;background:#232d3a;z-index:1}tbody tr:nth-child(even) td{background:#1f2731}.note{font-size:11px;color:var(--muted)}
@media(max-width:830px){.app{height:auto;min-height:100dvh}.panes{grid-template-columns:1fr}.pane{min-height:380px;max-height:65vh}}
</style>
<script src="tavi-viewer.js" defer></script>
</head>
<body><main class="app"><header class="top"><div><div class="eyebrow">XBRL GL Next · Experimental discussion viewer</div><h1>Tavi Viewer</h1></div><div><label for="instance">Instance JSON</label><select id="instance" aria-label="Instance JSON"></select><span id="status" class="status" role="status"></span></div></header>
<div class="panes"><section class="pane" aria-label="Properties"><div class="pane-head"><h2>Properties</h2><div class="subtitle">Source files (read-only)</div></div><div class="tabs" role="tablist" aria-label="Source"><button type="button" role="tab" data-tab="template" aria-selected="true">Table Template</button><button type="button" role="tab" data-tab="taxonomy" aria-selected="false">Tavi Taxonomy</button><button type="button" role="tab" data-tab="schema" aria-selected="false">JSON Schema</button></div><div id="source-name" class="source-name"></div><div class="scroll"><pre id="source"></pre></div></section>
<section class="pane" aria-label="Structured Tidy Data"><div class="pane-head"><h2>Structured Tidy Data</h2><div class="subtitle" id="csv-name">CSV transpose</div></div><div class="scroll" id="csv"></div></section></div><footer class="note">Static source and CSV display. This is not a Tavi semantic validator or JSON Schema validation engine.</footer></main></body></html>
